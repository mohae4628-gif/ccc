<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Wedding Invitation</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ألوان الفيديو المستوحاة من الظرف (شوكولاتة داكنة، ذهبي) */
            --dark-chocolate: #361608;
            --gold-accent: #d4af37;
            --text-on-dark: #eee;
            --envelope-body: #4a210d; /* لون جسم الظرف */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f0f0; 
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            font-family: 'Cormorant Garamond', serif; /* الخط الانسيابي الجديد */
        }

        .invitation-container {
            width: 100%;
            max-width: 480px; 
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            overflow: hidden;
            background-color: #fff;
        }

        /* --- 1. شاشة الظرف الثلاثية الأبعاد الواقعية (3D Envelope) --- */
        #splash-screen {
            display: none;
        }

        /* --- 2. المحتوى الرئيسي بالخلفية الموحدة الجديدة --- */
        #main-content {
            display: block;
            opacity: 1;
            transition: opacity 2s ease;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            /* [التعديل 1]: صورتك الجديدة كخلفية ثابتة */
            background-image: url('https://res.cloudinary.com/dyvadd9tt/image/upload/v1781217957/WhatsApp_Image_2026-06-11_at_3.18.20_PM_diuczq.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        /* تظليل خفيف فوق الخلفية ليظهر الكلام بوضوح (Overlay) */
        #main-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.65);
            z-index: -1;
        }

        /* --- حركات الدخول من اليمين واليسار --- */
        .slide-left {
            opacity: 0;
            transform: translateX(-70px);
            transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .slide-right {
            opacity: 0;
            transform: translateX(70px);
            transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .animate-active {
            opacity: 1;
            transform: translateX(0);
        }

        /* زر تشغيل الموسيقى */
        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--dark-chocolate);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            color: var(--dark-chocolate);
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }

        /* قسم الهيرو (العناوين) */
        .hero-section {
            text-align: center;
            padding: 80px 20px 40px 20px;
            color: var(--dark-chocolate);
            overflow: hidden;
        }

        .script-font {
            font-family: 'Alex Brush', cursive;
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--dark-chocolate);
        }

        .couple-names {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.2;
            margin: 20px 0;
            text-transform: uppercase;
        }
        .and-script {
            font-family: 'Alex Brush', cursive;
            font-size: 2.5rem;
            text-transform: lowercase;
            margin: 0 10px;
            color: var(--gold-accent);
        }

        .rings-separator {
            font-size: 2.5rem;
            margin: 30px 0;
        }

        .save-the-date {
            font-size: 1.1rem;
            letter-spacing: 5px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .date-time {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 2px;
            line-height: 1.6;
        }

        /* قسم العداد التنازلي البني الداكن (يغطي الخلفية) */
        .countdown-section {
            background-color: var(--dark-chocolate);
            color: var(--gold-accent);
            text-align: center;
            padding: 50px 20px;
            position: relative;
            z-index: 2;
        }
        .countdown-title {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 400;
        }
        .timer-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 2.5rem;
            font-weight: 700;
        }
        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .unit-label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
            color: var(--text-on-dark);
            font-family: sans-serif;
        }

        /* قسم الموقع (شفاف لتظهر الخلفية) */
        .location-section {
            padding: 60px 20px;
            text-align: center;
            color: var(--dark-chocolate);
            overflow: hidden;
        }
        .section-header {
            font-size: 1.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .venue-name {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            font-family: 'Cormorant Garamond', serif;
        }
        /* خريطة جوجل المدمجة */
        .map-container {
            width: 100%;
            height: 350px;
            margin: 30px 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* زر الاتجاهات المحدّث */
        .direction-link {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 1rem;
            letter-spacing: 2px;
            color: white;
            background-color: var(--dark-chocolate);
            border: none;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .direction-link:hover {
            background-color: var(--gold-accent);
            color: var(--dark-chocolate);
            transform: scale(1.05);
        }

        /* الفوتر الداكن */
        .invitation-footer {
            background-color: var(--dark-chocolate);
            color: var(--gold-accent);
            text-align: center;
            padding: 60px 20px;
            position: relative;
            z-index: 2;
        }
        .footer-names {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .footer-date {
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        
        <div id="splash-screen">
            <div class="envelope-wrapper" id="mainEnvelope" onclick="animateAndOpen()">
                <div class="envelope-body"></div>
                <div class="envelope-flap-left"></div>
                <div class="envelope-flap-right"></div>
                <div class="envelope-front"></div>
                <div class="wax-seal">M&N</div>
            </div>
            <p class="splash-text">OPEN ENVELOPE</p>
        </div>

        <div class="music-toggle" id="musicBtn" onclick="toggleMusic()" style="display: none;">🔊</div>
        <audio id="bgMusic" loop preload="auto">
            <source src="https://serv100.albumaty.com/2024/Albumaty.Com_hsyn_algsmy_fstank_alabyd.mp3" type="audio/mpeg">
        </audio>

        <div id="main-content">
            
            <section class="hero-section">
                <div class="script-font slide-left">We're getting married!</div>
                
                <div class="couple-names slide-right">Mohamed<br><span class="and-script">and</span><br>Nora</div>
                                
                <div class="save-the-date slide-right">SAVE THE DATE</div>
                <div class="date-time slide-right">
                    2026 / 06 / 30<br>
                    7:00 PM<br>
                    City Mark Resort
                </div>
            </section>

            <section class="countdown-section">
                <h3 class="countdown-title slide-left">COUNTDOWN TO OUR BIG DAY</h3>
                <div class="timer-display slide-right" id="timer">
                    <div class="time-unit"><span id="days">00</span><span class="unit-label">days</span></div> :
                    <div class="time-unit"><span id="hours">00</span><span class="unit-label">hours</span></div> :
                    <div class="time-unit"><span id="minutes">00</span><span class="unit-label">minutes</span></div> :
                    <div class="time-unit"><span id="seconds">00</span><span class="unit-label">seconds</span></div>
                </div>
            </section>

            <section class="location-section">
                <div class="section-header slide-left">OUR DAY</div>
                <div class="venue-name slide-right">City Mark Resort</div>
                
                <!-- خريطة جوجل المدمجة -->
                <div class="map-container slide-left">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3457.3685477776746!2d31.119240411428572!3d30.006089600000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x145845003f8a29a3:0x589a97b5bd27e17c!2sCity%20Mark%20Resort!5e0!3m2!1sen!2seg!4v1718037696270" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>

                <div class="slide-left">
                    <a href="https://www.google.com/maps/place/City+Mark+Resort/@30.0060896,31.1166655,17z/data=!3m1!4b1!4m6!3m5!1s0x145845003f8a29a3:0x589a97b5bd27e17c!8m2!3d30.0060896!4d31.1192404!16s%2Fg%2F11vyspr8pp?entry=ttu&g_ep=EgoyMDI2MDYwOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" class="direction-link">OPEN IN GOOGLE MAPS</a>
                </div>
            </section>

            <footer class="invitation-footer">
                <div class="footer-names slide-left">Mohamed<br><span class="and-script">and</span><br>Nora</div>
                <p class="footer-date slide-right">30 . 06 . 2026</p>
            </footer>

        </div>
    </div>

    <script>
        // دالة فتح الظرف الكاملة المحدثة (حركة 3D)
        function animateAndOpen() {
            const envelope = document.getElementById('mainEnvelope');
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');
            const musicBtn = document.getElementById('musicBtn');
            const music = document.getElementById('bgMusic');

            if (envelope.classList.contains('splash-open')) return; // لمنع النقر المزدوج

            // 1. فتح الغطاء العلوي ثلاثي الأبعاد
            envelope.classList.add('splash-open');
            
            // تشغيل الموسيقى
            music.play().catch(e => console.log("Audio play prevented"));
            document.getElementById('musicBtn').innerText = '⏸';

            // 2. انزلاق الظرف بالكامل للأسفل بعد اكتمال فتح الغطاء
            setTimeout(() => {
                splash.style.transform = 'translateY(100vh)'; /* ينزلق خارج الشاشة للأسفل */
                
                // 3. كشف المحتوى الرئيسي
                setTimeout(() => {
                    splash.style.display = 'none';
                    main.style.display = 'block';
                    musicBtn.style.display = 'flex'; /* إظهار أيقونة الصوت */
                    
                    setTimeout(() => { 
                        main.style.opacity = '1'; 
                        initScrollAnimations(); /* تفعيل أنيميشن التمرير */
                    }, 50);
                }, 1000); /* انتظار انزلاق الظرف للأسفل */
            }, 800); /* انتظار فتح غطاء الظرف */
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicBtn');
            if (music.paused) {
                music.play();
                btn.innerText = '⏸';
            } else {
                music.pause();
                btn.innerText = '🔊';
            }
        }

        // تفعيل حركة الدخول من اليمين واليسار عند النزول
        function initScrollAnimations() {
            const elements = document.querySelectorAll('.slide-left, .slide-right');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate-active');
                        observer.unobserve(entry.target); /* تفعيل الأنيميشن مرة واحدة فقط */
                    }
                });
            }, { threshold: 0.1 }); 

            elements.forEach(el => observer.observe(el));
        }

        // [التعديل 2]: العداد التنازلي مضبوط لليوم المحدد (30 يونيو 2026)
        const targetDate = new Date("June 30, 2026 19:00:00").getTime();

        const timerInterval = setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById("minutes").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById("seconds").innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
            } else {
                clearInterval(timerInterval);
                document.getElementById("timer").innerHTML = "<h3 style='font-size:1.5rem;'>JUST MARRIED!</h3>";
            }
        }, 1000);

        // تشغيل الموسيقى والـ animations مباشرة عند التحميل
        window.addEventListener('load', () => {
            const music = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicBtn');
            
            // تشغيل الموسيقى
            music.play().catch(e => console.log("Audio play prevented"));
            musicBtn.innerText = '⏸';
            musicBtn.style.display = 'flex';
            
            // تفعيل الـ animations مباشرة
            initScrollAnimations();
        });
    </script>
</body>
</html>
